name: Check availability

on:
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # Deliberately not cached. Restoring the cache and then reconciling apt
      # packages was slower and far more erratic than this straight install,
      # which lands in about twenty seconds every time. Predictability beats
      # a theoretical saving when the job has to work at an exact minute.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Report what is open
        run: npm run check

      - name: Upload page dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: out/
          retention-days: 7
