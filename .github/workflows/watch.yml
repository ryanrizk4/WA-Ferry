name: Watch for cancellations

# Between release waves, space reappears when other people cancel. This is the
# net that catches those. Interval is a deliberate compromise: tight enough to
# be useful, loose enough to stay polite to a public agency's servers and
# inside the Actions minutes budget on a private repo.
on:
  schedule:
    - cron: '*/20 * * * *'
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
    paths: ['src/**', '.github/workflows/watch.yml']
  workflow_dispatch:

# Separate from the snipe group: a watch tick must never queue behind a
# 40-minute snipe run, and a superseded tick is worth nothing.
concurrency:
  group: wsf-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Cache the browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Check availability and book anything that appears
        env:
          MODE: watch
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          WSF_EMAIL: ${{ secrets.WSF_EMAIL }}
          WSF_PASSWORD: ${{ secrets.WSF_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run book

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: watch-failure-${{ github.run_number }}
          path: out/
          retention-days: 7
