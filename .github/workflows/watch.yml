name: Watch for cancellations

# Between release waves, space reappears when other people cancel, and it does
# not last: a sailing seen open on one check was gone six minutes later. The
# only reliable way to catch those is to be looking when they happen, so this
# does not glance and exit. Each run holds open and polls for hours, and the
# next run is already queued behind it, waiting to take over the moment it
# ends. That is continuous cover, which is what this needs now that there is
# no laptop on the trip to fall back on.
on:
  schedule:
    - cron: '*/15 * * * *'
  # Independent of GitHub's scheduler, which has been unreliable here.
  # Touching .watch-trigger starts a run.
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
    paths: ['src/**', '.github/workflows/watch.yml', '.watch-trigger']
  workflow_dispatch:

# Separate from the snipe group: a watch run must never queue behind a snipe.
#
# cancel-in-progress is deliberately FALSE. It used to be true, which was right
# when a run was a ten-second glance and a superseded one was worth nothing.
# With long runs it would be fatal: the every-fifteen-minutes cron would kill
# the watcher a quarter of an hour into every shift, and cover would be worse
# than before. False instead makes the cron a relay. GitHub keeps at most one
# run pending per group, so the queue never piles up: one watching, one waiting
# to take over. timeout-minutes below caps a stuck run so the relay cannot
# stall behind it.
concurrency:
  group: wsf-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # The job runs until the code decides it is done. On a public repo that is
    # five and a half hours, just under the six-hour GitHub job limit, leaving
    # room for setup and for the handover to the next run. This is a backstop
    # against a hung browser, not the normal exit.
    timeout-minutes: 350
    permissions:
      # Naming any permission replaces the whole default set, so contents:read
      # has to be restated or checkout cannot clone this private repo.
      contents: read
      issues: write
      # Needed only for the hand-off step at the end: a run starts its
      # successor by dispatching this same workflow.
      actions: write
    steps:
      - name: Note when this run started
        run: date +%s > /tmp/run-started

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Deliberately not cached. Restoring the cache and then reconciling apt
      # packages was slower and far more erratic than this straight install,
      # which lands in about twenty seconds every time. Predictability beats
      # a theoretical saving when the job has to work at an exact minute.
      - name: Install Chromium
        # Retried because this is a network fetch and it does fail. On
        # 9 September it failed repeatedly, and since the hand-off fires no
        # matter what, every failure immediately started another run: about
        # 180 runs an hour, none of them watching anything.
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then exit 0; fi
            echo "Chromium install failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          echo "Chromium install failed three times"
          exit 1

      - name: Check availability and book anything that appears
        env:
          MODE: watch
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          WSF_EMAIL: ${{ secrets.WSF_EMAIL }}
          WSF_PASSWORD: ${{ secrets.WSF_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CALL_NUMBER: ${{ secrets.NTFY_CALL_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run book

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: watch-failure-${{ github.run_number }}
          path: out/
          retention-days: 7

      # Hand off to the next run.
      #
      # GitHub's cron is the weak link in this whole system. Over one
      # fourteen-hour stretch an every-fifteen-minutes schedule produced 36
      # runs where it promised about 120, and the gaps are exactly when a
      # returned cancellation goes to somebody else. So the watch does not
      # depend on the schedule to continue: each run asks for the next one
      # itself, and the cron becomes a safety net rather than the mechanism.
      #
      # if: always() is the point. A crashed run, a hung browser, a job killed
      # at the timeout — all of them still hand off. The only thing that stops
      # the chain is the code deliberately writing out/stop-watching, which it
      # does when the reservation is made or the travel window has closed.
      #
      # A workflow_dispatch made with GITHUB_TOKEN does start a new run;
      # ordinary pushes made with that token do not, which is why this is a
      # dispatch and not a commit to a trigger file.
      - name: Start the next watch run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CALL_NUMBER: ${{ secrets.NTFY_CALL_NUMBER }}
        run: |
          if [ -f out/stop-watching ]; then
            echo "standing down: $(cat out/stop-watching)"
            exit 0
          fi
          # Hard stop on the calendar as well as on the marker file. If the
          # code somehow crashed before it could write the marker, this is
          # what stops the chain running forever after the trip is over.
          if [ "$(date -u +%Y%m%d)" -gt 20260915 ]; then
            echo "past the travel window; not handing off"
            exit 0
          fi
          # Only chain on a public repository.
          #
          # Chaining makes the watch continuous, which is the point, but
          # continuous means billing roughly 1,400 Actions minutes a day. On a
          # private repository the free allowance is 2,000 a month: the chain
          # would eat it in under two days and then everything stops, including
          # the release snipers, which are the runs that cannot be missed.
          # Public repositories are unmetered, so there it is free.
          #
          # This is checked here rather than trusted from the application code,
          # so that a crash in that code cannot leave the chain running against
          # a metered account.
          vis=$(curl -sS -H "authorization: Bearer $GH_TOKEN" \
                     -H "accept: application/vnd.github+json" \
                     "https://api.github.com/repos/${{ github.repository }}" \
                | grep -o '"visibility"[^,]*' | head -1)
          echo "repository $vis"
          case "$vis" in
            *public*) ;;
            *)
              echo "private repository: not chaining, because continuous running"
              echo "would exhaust the free Actions minutes in under two days."
              echo "The schedule still runs. Make the repository public for"
              echo "continuous cover."
              exit 0
              ;;
          esac

          # Never hand off faster than this. The hand-off is deliberately
          # unconditional so a crash cannot end the watch, but that same
          # property turns any fast, repeating failure into a hot loop. A run
          # that lasted seconds waits here before starting its successor, so a
          # broken state costs a few runs an hour instead of hundreds, and
          # still heals itself the moment the underlying problem clears.
          MIN_CYCLE=180
          started=$(cat /tmp/run-started 2>/dev/null || echo 0)
          now=$(date +%s)
          elapsed=$(( now - started ))
          if [ "$started" -gt 0 ] && [ "$elapsed" -lt "$MIN_CYCLE" ]; then
            wait=$(( MIN_CYCLE - elapsed ))
            echo "this run lasted only ${elapsed}s, which means something is failing fast."
            echo "waiting ${wait}s before handing off, so this cannot become a hot loop."
            sleep "$wait"
          fi

          echo "handing off to the next watch run"
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "authorization: Bearer $GH_TOKEN" \
            -H "accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/watch.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}')
          echo "dispatch HTTP $code"
          if [ "$code" = "204" ]; then
            exit 0
          fi

          # A failed hand-off means the watch has just stopped, and every way
          # that has gone wrong in this project so far has been silent. A red
          # run in a tab nobody is looking at is not good enough, so say it out
          # loud on the phone.
          cat /tmp/dispatch.out || true
          if [ -n "$NTFY_TOPIC" ]; then
            curl -sS -X POST "https://ntfy.sh/$NTFY_TOPIC" \
              -H "title: FERRY WATCH STOPPED - it needs restarting" \
              -H "priority: urgent" \
              -H "tags: warning" \
              -d "The watch could not start its next run (HTTP $code), so nothing is looking for cancellations right now. Open the repository's Actions tab and run 'Watch for cancellations' by hand." || true
          fi
          exit 1
