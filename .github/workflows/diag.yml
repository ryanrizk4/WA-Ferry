name: Diagnose the captcha question

# One-off: does a signed-in session still get the reCAPTCHA on the booking
# step? Runs only when asked, never on a schedule.
on:
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
    paths: ['src/diag.js', '.github/workflows/diag.yml']
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Probe
        env:
          WSF_EMAIL: ${{ secrets.WSF_EMAIL }}
          WSF_PASSWORD: ${{ secrets.WSF_PASSWORD }}
        run: node src/diag.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag
          path: out/
          retention-days: 7
