name: Recon WSF reservation site

on:
  workflow_dispatch:
    inputs:
      entry_url:
        description: Entry URL to start the recon walk from
        required: false
        default: https://secureapps.wsdot.wa.gov/Ferries/Reservations/Vehicle/default.aspx

jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run recon
        env:
          ENTRY_URL: ${{ inputs.entry_url }}
        run: npm run recon

      - name: Upload page dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recon-output
          path: out/
          retention-days: 7
