name: Check availability

on:
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Cache the browser
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: Install Chromium
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps for cached browser
        if: steps.pwcache.outputs.cache-hit == 'true'
        # apt here is erratic: seventeen seconds one run, many minutes the
        # next. The runner image already ships the libraries Chromium needs,
        # so bound this and carry on rather than let it eat the warm-up window
        # before a release. If deps really were missing, the browser fails to
        # launch and the run says so loudly.
        run: timeout 150 npx playwright install-deps chromium || echo "skipping deps; runner image should already have them"

      - name: Report what is open
        run: npm run check

      - name: Upload page dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-output
          path: out/
          retention-days: 7
