name: Snipe reservation release

# The two moments that matter. WSF releases the last 30% of standard vehicle
# space at 7:00 a.m. Pacific, two days before each sailing date:
#   Fri Sept 11 -> sailings on Sun Sept 13
#   Sat Sept 12 -> sailings on Mon Sept 14
#
# Actions cron is queued, not precise: a job asked for at :00 can start several
# minutes late. So these fire well early and the script itself waits out the
# remaining time and sprints at the exact second.
on:
  schedule:
    # Two entries on purpose. This fires exactly twice in its life and there
    # is no second chance, and GitHub is known to drop scheduled runs under
    # load. Either one is enough: the script idles until two minutes before
    # the release regardless of when it started, and the concurrency group
    # keeps them from overlapping. A duplicate that starts after the release
    # has passed exits on its own without booking anything.
    # The two 7 a.m. releases.
    - cron: '20 13 11,12 9 *'   # 06:20 PT Sept 11 and 12
    - cron: '30 13 11,12 9 *'   # 06:30 PT Sept 11 and 12
    # The two 5 p.m. cancellation deadlines the day before each sailing date.
    # 17:00 PT is 00:00 UTC the following day, so these are dated the 13th and
    # 14th in UTC while landing on the afternoon of the 12th and 13th Pacific.
    - cron: '20 23 12,13 9 *'   # 16:20 PT Sept 12 and 13
    - cron: '30 23 12,13 9 *'   # 16:30 PT Sept 12 and 13
    # Monday morning, before the two-hour lockout closes the door on the 7:05.
    - cron: '10 11 14 9 *'      # 04:10 PT Sept 14
    - cron: '20 11 14 9 *'      # 04:20 PT Sept 14
  # Independent of GitHub's scheduler. Touching this file starts a snipe run,
  # which gives a second, unrelated way to fire at 7 a.m. if cron does not.
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
    paths: ['.snipe-trigger']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Fill everything in but stop before the final confirm
        type: boolean
        default: true

concurrency:
  group: wsf-booking
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      # Naming any permission replaces the whole default set, so contents:read
      # has to be restated or checkout cannot clone this private repo.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Deliberately not cached. Restoring the cache and then reconciling apt
      # packages was slower and far more erratic than this straight install,
      # which lands in about twenty seconds every time. Predictability beats
      # a theoretical saving when the job has to work at an exact minute.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for the release, then book
        env:
          MODE: snipe
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          WSF_EMAIL: ${{ secrets.WSF_EMAIL }}
          WSF_PASSWORD: ${{ secrets.WSF_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_CALL_NUMBER: ${{ secrets.NTFY_CALL_NUMBER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run book

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snipe-${{ github.run_number }}
          path: out/
          retention-days: 14
