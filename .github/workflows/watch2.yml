name: Watch for cancellations (second schedule)

# A duplicate of the watch schedule on a different cron, because GitHub's
# scheduler dropped almost every firing of the first one: two runs in ten hours
# against an every-fifteen-minutes cron. Two independent schedules give two
# chances that any given slot actually fires.
#
# This costs nothing extra. Both share the wsf-watch concurrency group, so a
# run started by either supersedes any run already going rather than adding to
# it. Original note follows.
#
# Between release waves, space reappears when other people cancel, and it does
# not last: a sailing seen open on one check was gone six minutes later — tight enough to catch those, loose enough
# to stay polite to a public agency's servers and to fit the Actions minutes
# budget on a private repo (roughly 100 runs a day).
on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  # Independent of GitHub's scheduler, which has not fired once here.
  # Touching .watch-trigger runs a check.
  push:
    branches: [claude/orcas-anacortes-ferry-tickets-211jzp]
    paths: ['.watch-trigger-2']
  workflow_dispatch:

# Separate from the snipe group: a watch tick must never queue behind a
# 40-minute snipe run, and a superseded tick is worth nothing.
concurrency:
  group: wsf-watch
  cancel-in-progress: true

jobs:
  watch2:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      # Naming any permission replaces the whole default set, so contents:read
      # has to be restated or checkout cannot clone this private repo.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      # Deliberately not cached. Restoring the cache and then reconciling apt
      # packages was slower and far more erratic than this straight install,
      # which lands in about twenty seconds every time. Predictability beats
      # a theoretical saving when the job has to work at an exact minute.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check availability and book anything that appears
        env:
          MODE: watch
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          WSF_EMAIL: ${{ secrets.WSF_EMAIL }}
          WSF_PASSWORD: ${{ secrets.WSF_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run book

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: watch-failure-${{ github.run_number }}
          path: out/
          retention-days: 7
